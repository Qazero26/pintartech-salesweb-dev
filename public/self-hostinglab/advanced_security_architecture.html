        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #090d16;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        .slide-container {
            min-height: calc(100vh - 120px);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .cyber-glow-blue { box-shadow: 0 0 25px rgba(59, 130, 246, 0.25); }
        .cyber-glow-cyan { box-shadow: 0 0 25px rgba(6, 182, 212, 0.25); }
        .cyber-glow-orange { box-shadow: 0 0 25px rgba(249, 115, 22, 0.25); }
        .cyber-glow-red { box-shadow: 0 0 25px rgba(239, 68, 68, 0.25); }
        .cyber-glow-emerald { box-shadow: 0 0 25px rgba(16, 185, 129, 0.25); }

        .slide-fade-enter {
            opacity: 0;
            transform: translateY(10px) scale(0.99);
        }
        .slide-fade-active {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition: opacity 0.25s ease-out, transform 0.25s ease-out;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2937;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {

                                "Security bukan keadaan tetap.<br><span class="text-cyan-400">Security ialah proses yang berterusan.</span>"
                            </p>
                        </div>
                        <p class="text-xs text-gray-500 font-mono">Tahniah! Anda telah menamatkan 102 Slide Advanced Security Architecture.</p>
                    </div>
                `
            }
        ];

        let currentSlideIndex = 0;

        function renderSlide(index) {
            if (index < 0) index = 0;
            if (index >= slides.length) index = slides.length - 1;
            
            currentSlideIndex = index;
            const slide = slides[currentSlideIndex];

            // Update Header & Progress
            document.getElementById('current-slide-num').innerText = slide.id;
            document.getElementById('total-slides-num').innerText = slides.length;
            document.getElementById('jump-input').value = slide.id;
            
            const progressPercent = ((slide.id) / slides.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            // Render Content
            const container = document.getElementById('slide-content');
            container.classList.remove('slide-fade-active');
            
            setTimeout(() => {
                container.innerHTML = `
                    <div class="space-y-4">
                        <div class="flex items-center justify-between border-b border-gray-800/80 pb-3">
                            <div>
                                <span class="text-2xs font-mono font-bold tracking-wider px-2.5 py-1 rounded bg-cyan-950/80 text-cyan-400 border border-cyan-800/50">
                                    ${slide.category}
                                </span>
                                <h2 class="text-2xl md:text-3xl font-bold text-white mt-2">${slide.title}</h2>
                                <p class="text-xs md:text-sm text-gray-400 mt-0.5">${slide.subtitle}</p>
                            </div>
                            <span class="text-xs font-mono text-gray-600 font-bold hidden sm:block">SLIDE ${slide.id}</span>
                        </div>
                        <div class="pt-2">
                            ${slide.content}
                        </div>
                    </div>
                `;
                container.classList.add('slide-fade-active');
                lucide.createIcons();

                // Initialize interactive slide elements if present in current slide
                if (document.getElementById('tm-select')) runThreatModelSim();
                if (document.getElementById('fw-src')) evalFirewallRule();
                if (document.getElementById('zt-id')) evalZeroTrust();
                if (document.getElementById('rm-like')) calcRiskMatrix();
            }, 50);

            // Button Disable States
            document.getElementById('btn-prev').disabled = (currentSlideIndex === 0);
            document.getElementById('btn-next').disabled = (currentSlideIndex === slides.length - 1);
        }

        function nextSlide() {
            if (currentSlideIndex < slides.length - 1) {
                renderSlide(currentSlideIndex + 1);
            }
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                renderSlide(currentSlideIndex - 1);
            }
        }

        function jumpToSlideInput(val) {
            const num = parseInt(val);
            if (!isNaN(num) && num >= 1 && num <= slides.length) {
                renderSlide(num - 1);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            if (e.key === 'ArrowRight' || e.key === 'Space') {
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                prevSlide();
            } else if (e.key === 'Home') {
                renderSlide(0);
            } else if (e.key === 'End') {
                renderSlide(slides.length - 1);
            }
        });

        function toggleGridModal() {
            const modal = document.getElementById('grid-modal');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                populateGridModal();
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        function populateGridModal(filter = "") {
            const list = document.getElementById('grid-modal-list');
            list.innerHTML = "";
            slides.forEach((s, idx) => {
                if (filter && !s.title.toLowerCase().includes(filter.toLowerCase()) && !s.category.toLowerCase().includes(filter.toLowerCase())) {
                    return;
                }
                const isActive = idx === currentSlideIndex;
                const card = document.createElement('div');
                card.className = `p-3 rounded-xl border text-xs cursor-pointer transition flex flex-col justify-between ${
                    isActive ? 'bg-cyan-950 border-cyan-400 text-white font-bold' : 'bg-gray-900 border-gray-800 text-gray-300 hover:border-gray-700 hover:bg-gray-850'
                }`;
                card.onclick = () => {
                    renderSlide(idx);
                    toggleGridModal();
                };
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between text-2xs font-mono text-gray-500 mb-1">
                            <span>SLIDE ${s.id}</span>
                            <span class="text-cyan-400">${s.category}</span>
                        </div>
                        <div class="font-semibold text-gray-200 line-clamp-2">${s.title}</div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function filterSlides(val) {
            populateGridModal(val);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Interactive Threat Model Logic
        function runThreatModelSim() {
            const selectEl = document.getElementById('tm-select');
            const res = document.getElementById('tm-result-box');
            if (!selectEl || !res) return;

            const val = selectEl.value;
            if (val === 'creds') {
                res.innerHTML = `
                    <div class="text-red-400 font-bold">RISK LEVEL: HIGH (Likelihood: High, Impact: Critical)</div>
                    <p class="text-gray-300 mt-1">Ancaman: Kata laluan admin dicuri menerusi serangan Phishing / Breach luaran.</p>
                    <div class="text-emerald-400 font-bold mt-2">RECOMMENDED CONTROLS:</div>
                    <ul class="list-disc list-inside text-gray-300 text-2xs space-y-0.5">
                        <li>Cloudflare Access MFA Policy (Hardware Key/Passkey)</li>
                        <li>Session timeout 15 minit & Anomaly Logins Alerting</li>
                        <li>Rotate secrets vault credentials</li>
                    </ul>
                `;
            } else if (val === 'exploit') {
                res.innerHTML = `
                    <div class="text-red-400 font-bold">RISK LEVEL: CRITICAL (Likelihood: High, Impact: High)</div>
                    <p class="text-gray-300 mt-1">Ancaman: Penyerang mengambil alih server melalui CVE pada pakej terdedah.</p>
                    <div class="text-emerald-400 font-bold mt-2">RECOMMENDED CONTROLS:</div>
                    <ul class="list-disc list-inside text-gray-300 text-2xs space-y-0.5">
                        <li>Aktifkan Cloudflare WAF Managed Ruleset</li>
                        <li>Jalankan Vulnerability Scanning (Trivy) dalam CI/CD</li>
                        <li>Tampal security patch dengan serta-merta</li>
                    </ul>
                `;
            } else if (val === 'iot') {
                res.innerHTML = `
                    <div class="text-amber-400 font-bold">RISK LEVEL: MEDIUM (Likelihood: High, Impact: Medium)</div>
                    <p class="text-gray-300 mt-1">Ancaman: Kamera IP rumah dicemari Botnet dan merebak dalam LAN.</p>
                    <div class="text-emerald-400 font-bold mt-2">RECOMMENDED CONTROLS:</div>
                    <ul class="list-disc list-inside text-gray-300 text-2xs space-y-0.5">
                        <li>Asingkan peranti ke VLAN 30 (IoT VLAN)</li>
                        <li>Sekat trafik inter-VLAN ke VLAN Server & Management</li>
                        <li>Lumpuhkan UPnP pada router</li>
                    </ul>
                `;
            } else if (val === 'dataloss') {
                res.innerHTML = `
                    <div class="text-red-400 font-bold">RISK LEVEL: HIGH (Likelihood: Medium, Impact: Critical)</div>
                    <p class="text-gray-300 mt-1">Ancaman: Ransomware menyulitkan cakera keras atau terpadam data.</p>
                    <div class="text-emerald-400 font-bold mt-2">RECOMMENDED CONTROLS:</div>
                    <ul class="list-disc list-inside text-gray-300 text-2xs space-y-0.5">
                        <li>Immutable 3-2-1 Encrypted Backup</li>
                        <li>Offsite Storage Snapshot (Restic/Brestic)</li>
                        <li>Jalankan ujian pemulihan (Restore Drill) secara harian</li>
                    </ul>
                `;
            }
        }

        // Interactive Defense-in-Depth Layer Display
        function showDidLayer(layer) {
            const panel = document.getElementById('did-info-panel');
            if (!panel) return;

            const data = {
                edge: { title: "Layer 1: Perimeter / Edge", desc: "Cloudflare DNS, DDoS Mitigation, WAF Rules, Geo-blocking, Origin IP Hiding." },
                identity: { title: "Layer 2: Identity & Access", desc: "Single Sign-On (SSO), Multi-Factor Auth (MFA), Passkeys, RBAC Least Privilege." },
                network: { title: "Layer 3: Network Segmentation", desc: "OPNsense Firewall, VLAN Client/Server/IoT, WireGuard VPN, Microsegmentation." },
                host: { title: "Layer 4: Host Hardening", desc: "Linux OS Kernel Updates, SSH Key Authentication, Uncomplicated Firewall (UFW)." },
                container: { title: "Layer 5: Container Isolation", desc: "Docker Non-root users, Read-only Filesystem, Minimal Base Images (Alpine/Distroless)." },
                app: { title: "Layer 6: Application Security", desc: "Input Validation, Parameterized SQL Queries, Rate Limiting, Secure Cookies." },
                data: { title: "Layer 7: Data Protection", desc: "LUKS Disk Encryption, Secrets Management Vault, TLS 1.3 In-Transit Encryption." },
                recovery: { title: "Layer 8: Recovery & Resilience", desc: "3-2-1 Offsite Immutable Backup, System Disaster Drills, Automated Snapshots." }
            };
            if (data[layer]) {
                panel.innerHTML = `
                    <h4 class="text-cyan-400 font-bold text-sm">${data[layer].title}</h4>
                    <p class="text-gray-300 mt-1">${data[layer].desc}</p>
                `;
            }
        }

        // Firewall Interactive Simulation
        function evalFirewallRule() {
            const srcEl = document.getElementById('fw-src');
            const dstEl = document.getElementById('fw-dst');
            const res = document.getElementById('fw-result');
            if (!srcEl || !dstEl || !res) return;

            const src = srcEl.value;
            const dst = dstEl.value;

            if (src === 'admin' && dst === 'ssh') {
                res.innerHTML = `<span class="text-emerald-400 font-bold">KEPUTUSAN FIREWALL: ALLOW ✅ (Authorized Admin SSH Access)</span>`;
            } else if (src === 'client' && dst === 'web') {
                res.innerHTML = `<span class="text-emerald-400 font-bold">KEPUTUSAN FIREWALL: ALLOW ✅ (Public HTTPS Traffic allowed to Reverse Proxy)</span>`;
            } else if (src === 'iot' && (dst === 'db' || dst === 'ssh')) {
                res.innerHTML = `<span class="text-red-400 font-bold">KEPUTUSAN FIREWALL: DENY ❌ (IoT Devices restricted from internal servers!)</span>`;
            } else {
                res.innerHTML = `<span class="text-red-400 font-bold">KEPUTUSAN FIREWALL: DENY ❌ (Default Deny Rule Triggered)</span>`;
            }
        }

        // Zero Trust Policy Evaluator
        function evalZeroTrust() {
            const idEl = document.getElementById('zt-id');
            const mfaEl = document.getElementById('zt-mfa');
            const devEl = document.getElementById('zt-dev');
            const out = document.getElementById('zt-output');
            if (!idEl || !mfaEl || !devEl || !out) return;

            const id = idEl.value;
            const mfa = mfaEl.value;
            const dev = devEl.value;

            if (id === 'admin' && mfa === 'yes' && dev === 'managed') {
                out.className = "p-3 bg-emerald-950 rounded border border-emerald-800 text-center font-bold text-sm text-emerald-400";
                out.innerText = "KEPUTUSAN: ALLOW ✅ Access Granted to Admin Dashboard";
            } else {
                out.className = "p-3 bg-red-950 rounded border border-red-800 text-center font-bold text-sm text-red-400";
                out.innerText = "KEPUTUSAN: DENY ❌ Access Blocked! Policy requirement failed.";
            }
        }

        // Blast Radius Simulation
        function simBlast(mode) {
            const out = document.getElementById('blast-output');
            if (!out) return;

            if (mode === 'flat') {
                out.innerHTML = `
                    <div class="text-red-400 font-bold mb-1">FLAT NETWORK RESULT:</div>
                    <p class="text-gray-300">Malware pada Kamera IoT merebak ke PC Client, Raspberry Pi Server, & NAS Storage dalam beberapa minit!</p>
                `;
            } else {
                out.innerHTML = `
                    <div class="text-emerald-400 font-bold mb-1">SEGMENTED NETWORK RESULT:</div>
                    <p class="text-gray-300">Malware pada Kamera IoT terasing sepenuhnya dalam VLAN 30. Server & NAS kekal selamat! ✅</p>
                `;
            }
        }

        // Risk Matrix Calculator
        function calcRiskMatrix() {
            const likeEl = document.getElementById('rm-like');
            const impEl = document.getElementById('rm-imp');
            const res = document.getElementById('rm-result');
            if (!likeEl || !impEl || !res) return;

            const l = parseInt(likeEl.value);
            const i = parseInt(impEl.value);
            const score = l * i;

            if (score <= 2) {
                res.innerHTML = `<span class="text-emerald-400">Tahap Risiko: LOW (${score}/9) - Monitor berkala.</span>`;
            } else if (score <= 5) {
                res.innerHTML = `<span class="text-amber-400">Tahap Risiko: MEDIUM (${score}/9) - Jadualkan pemulihan.</span>`;
            } else {
                res.innerHTML = `<span class="text-red-400">Tahap Risiko: CRITICAL (${score}/9) - Wajib diambil tindakan serta-merta!</span>`;
            }
        }

        // Interactive Quizzes Checking
        function checkQuiz(qNum, ans) {
            const correctAns = { 1: 'B', 2: 'B', 3: 'B', 4: 'B', 5: 'B' };
            const box = document.getElementById(`quiz-ans-${qNum}`);
            if (!box) return;

            box.classList.remove('hidden');

            if (ans === correctAns[qNum]) {
                box.className = "p-3 bg-emerald-950 border border-emerald-800 text-emerald-400 rounded font-bold";
                box.innerText = "TEPAT! Jawapan anda betul. ✅";
            } else {
                box.className = "p-3 bg-red-950 border border-red-800 text-red-400 rounded font-bold";
                box.innerText = "SALAH. Jawapan yang betul ialah B.";
            }
        }

        // Initialize presentation on load
        window.onload = () => {
            renderSlide(0);
        };
    </script>
</body>
</html>
