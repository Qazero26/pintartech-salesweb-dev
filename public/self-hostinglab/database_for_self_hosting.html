        function nextSlide() {
            if (currentSlideIndex < slidesData.length - 1) {
                renderSlide(currentSlideIndex + 1);
            }
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                renderSlide(currentSlideIndex - 1);
            }
        }

            renderSlide(0);
        }

        function goToLastSlide() {
            renderSlide(slidesData.length - 1);

        document.addEventListener('keydown', (e) => {

                4: "✅ TEPAT! Walaupun container dipadam, data dalam Volume kekal wujud dan boleh di-mount semula."
            };
            const feedback = document.getElementById(`quiz${quizId}-feedback`);
            if (feedback) {
                feedback.classList.remove('hidden', 'bg-red-950/60', 'text-red-300', 'bg-teal-950/60', 'text-teal-300', 'border-red-500/40', 'border-teal-500/40');
                if (option === answers[quizId]) {
                    feedback.classList.add('bg-teal-950/60', 'text-teal-300', 'border', 'border-teal-500/40');
                    feedback.innerText = explanations[quizId];
                } else {
                    feedback.classList.add('bg-red-950/60', 'text-red-300', 'border', 'border-red-500/40');
                    feedback.innerText = "❌ Kurang tepat. Sila cuba lagi!";
                }
            }
        }

        window.onload = function() {
            renderSlide(0);
        };
    </script>
</body>
</html>
