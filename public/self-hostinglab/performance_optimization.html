    body {
      background-color: #060913;
      color: #f3f4f6;
      font-family: 'Plus Jakarta Sans', sans-serif;

      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0b0f19;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #1f2937;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #374151;
    }

      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);

      box-shadow: 0 0 25px -5px rgba(59, 130, 246, 0.25);

    .glow-box-green {

      transition: opacity 0.25s ease-in-out, transform 0.25s ease-in-out;

</head>
<body class="min-h-screen flex flex-col justify-between select-none">

  <!-- TOP NAVIGATION / HEADER -->

      <div id="slide-content-container" class="flex-1 flex flex-col justify-center">
        <!-- JS mounts content here -->
      </div>
    </div>
  </main>

      <!-- Generated dynamically -->

    /* Toast Helper */
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      toastMsg.innerText = msg;
      toast.classList.remove('opacity-0');
      setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 2000);
    }

    /* Copy Command Helper */
    function copyCommand(cmdText) {
      navigator.clipboard.writeText(cmdText).then(() => {
        showToast(`Command disalin: "${cmdText}"`);
      });
    }

        content: `
          <div class="p-4 bg-gray-900 rounded-xl border border-gray-800 font-mono text-xs space-y-1">
            <p>Home Network → Rangkaian fizikal & Ethernet</p>
            <p>Docker → Had memori & CPU kontena</p>
            <p>Database → SQL query & Indexing</p>
            <p>Monitoring → Prometheus Golden Signals</p>
          </div>
        `
      },

      // SLIDE 94
      {
        id: 94,
        category: "Workflow",
        title: "Master Performance Workflow",
        subtitle: "Kitaran berterusan peningkatan prestasi.",
        content: `
          <div class="p-4 bg-noc-card rounded-xl border border-gray-800 font-mono text-xs text-center space-y-1">
            <p class="text-blue-400">MEASURE → BASELINE → IDENTIFY BOTTLENECK</p>
            <p class="text-amber-400">HYPOTHESIS → CHANGE → BENCHMARK</p>
            <p class="text-emerald-400">VERIFY → MONITOR → DOCUMENT</p>
          </div>
        `
      },

      // SLIDE 95
      {
        id: 95,
        category: "Next Topic",
        title: "Topik Seterusnya",
        subtitle: "Preview modul akan datang.",
        content: `
          <div class="p-6 bg-gradient-to-r from-blue-950 to-indigo-950 border border-blue-500/40 rounded-2xl text-center space-y-3">
            <span class="text-xs text-blue-400 uppercase font-mono font-bold">MODUL AKAN DATANG</span>
            <h2 class="text-2xl font-bold text-white">"Cloud vs VPS vs Home Server"</h2>
            <p class="text-xs text-gray-300">Mana Satu Sesuai Untuk Workload Anda?</p>
          </div>
        `
      },

      // SLIDE 96
      {
        id: 96,
        category: "Conclusion",
        title: "Penutup",
        subtitle: "Prinsip utama yang perlu diingati selamanya.",
        content: `
          <div class="text-center max-w-2xl mx-auto space-y-6">
            <h1 class="text-3xl md:text-4xl font-extrabold text-white font-mono leading-tight">
              "Performance Is A Measurement, Not A Feeling."
            </h1>

            <div class="p-4 bg-noc-card rounded-xl border border-gray-800 font-mono text-xs flex justify-center gap-2 text-blue-400">
              <span>MEASURE</span> → <span>FIND</span> → <span>OPTIMIZE</span> → <span>TEST</span> → <span>MONITOR</span>
            </div>

            <p class="text-base text-gray-300 italic">
              "Jangan terus upgrade hardware. Cari bottleneck dahulu."
            </p>
          </div>
        `
      }
    ];

    /* Presentation State */
    let currentSlideIndex = 0;

    /* Initialize Presentation */
    function initPresentation() {
      document.getElementById('total-slide-num').innerText = slides.length;
      renderSlide(currentSlideIndex);
      buildOverviewGrid();

      // Keyboard Controls
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === ' ') {
          nextSlide();
        } else if (e.key === 'ArrowLeft') {
          prevSlide();
        } else if (e.key === 'Home') {
          goToSlide(0);
        } else if (e.key === 'End') {
          goToSlide(slides.length - 1);
        } else if (e.key === 'o' || e.key === 'O') {
          toggleOverviewModal();
        } else if (e.key === 'f' || e.key === 'F') {
          toggleFullscreen();
        }
      });
    }

    /* Render Active Slide */
    function renderSlide(index) {
      if (index < 0 || index >= slides.length) return;
      currentSlideIndex = index;

      const slide = slides[index];
      const container = document.getElementById('slide-content-container');

      // Update Header Numbers
      document.getElementById('current-slide-num').innerText = slide.id;

      // Update Progress Bar
      const percentage = Math.round(((index + 1) / slides.length) * 100);
      document.getElementById('progress-bar-fill').style.width = `${percentage}%`;
      document.getElementById('progress-percentage').innerText = `${percentage}%`;

      // Update Disabled Buttons
      document.getElementById('btn-prev').disabled = index === 0;
      document.getElementById('btn-next').disabled = index === slides.length - 1;

      // Render Content HTML
      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex items-center justify-between border-b border-gray-800/80 pb-3">
            <span class="px-2.5 py-0.5 rounded-full bg-blue-500/10 border border-blue-500/30 text-blue-400 text-[10px] uppercase font-mono font-bold tracking-wider">
              ${slide.category}
            </span>
            <span class="text-xs font-mono text-gray-500">SLIDE ${slide.id} OF ${slides.length}</span>
          </div>

          <div>
            <h2 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight">${slide.title}</h2>
            <p class="text-xs md:text-sm text-gray-400 mt-1">${slide.subtitle}</p>
          </div>

          <div class="pt-2">
            ${slide.content}
          </div>
        </div>
      `;

      // Re-trigger slide animation
      const viewport = document.getElementById('slide-viewport');
      viewport.classList.add('opacity-80', 'scale-[0.99]');
      setTimeout(() => {
        viewport.classList.remove('opacity-80', 'scale-[0.99]');
      }, 150);
    }

    /* Navigation Handlers */
    function nextSlide() {
      if (currentSlideIndex < slides.length - 1) {
        renderSlide(currentSlideIndex + 1);
      }
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        renderSlide(currentSlideIndex - 1);
      }
    }

    function goToSlide(index) {
      renderSlide(index);
      closeOverviewModal();
    }

    /* Overview Modal Handlers */
    function toggleOverviewModal() {
      const modal = document.getElementById('overview-modal');
      modal.classList.toggle('hidden');
    }

    function closeOverviewModal() {
      document.getElementById('overview-modal').classList.add('hidden');
    }

    function buildOverviewGrid() {
      const grid = document.getElementById('overview-grid');
      grid.innerHTML = '';

      slides.forEach((slide, idx) => {
        const item = document.createElement('button');
        item.onclick = () => goToSlide(idx);
        item.className = `p-3 text-left rounded-xl border transition flex flex-col justify-between h-28 ${
          idx === currentSlideIndex
            ? 'bg-blue-950/60 border-blue-500 text-white font-bold'
            : 'bg-noc-card border-gray-800 text-gray-300 hover:border-gray-600 hover:bg-gray-800'
        }`;

        item.innerHTML = `
          <div class="flex items-center justify-between w-full text-[10px] font-mono text-gray-400">
            <span>#${slide.id}</span>
            <span class="px-1.5 py-0.5 rounded bg-gray-900 border border-gray-700 text-blue-400">${slide.category}</span>
          </div>
          <p class="text-xs line-clamp-2 mt-1 font-semibold">${slide.title}</p>
          <span class="text-[9px] text-gray-500 line-clamp-1">${slide.subtitle}</span>
        `;
        grid.appendChild(item);
      });
    }

    function filterSlides() {
      const query = document.getElementById('slide-search').value.toLowerCase();
      const grid = document.getElementById('overview-grid');
      const buttons = grid.getElementsByTagName('button');

      Array.from(buttons).forEach((btn, idx) => {
        const slide = slides[idx];
        const match = slide.title.toLowerCase().includes(query) || slide.category.toLowerCase().includes(query);
        btn.style.display = match ? 'flex' : 'none';
      });
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    /* Slide 80 Inspector */
    function inspectNode(name, latency, status, desc) {
      const box = document.getElementById('inspector-result');
      box.classList.remove('hidden');
      box.innerHTML = `
        <div class="space-y-1">
          <div class="flex justify-between items-center text-sm">
            <span class="text-blue-400 font-bold">${name}</span>
            <span class="text-xs">${status}</span>
          </div>
          <p class="text-gray-300 text-xs">Latensi Pilihan: <strong class="text-white">${latency}</strong></p>
          <p class="text-gray-400 text-xs">${desc}</p>
        </div>
      `;
    }

    /* Slide 81 CPU/RAM Sim */
    function updateSimMetrics() {
      const cpu = document.getElementById('sim-cpu-slider').value;
      const ram = document.getElementById('sim-ram-slider').value;

      document.getElementById('sim-cpu-val').innerText = `${cpu}%`;
      document.getElementById('sim-ram-val').innerText = `${ram}%`;

      const statusBox = document.getElementById('sim-status-box');

      if (cpu > 85 || ram > 85) {
        statusBox.className = "p-4 rounded-xl font-mono text-center bg-red-950/40 border border-red-500/50 text-red-300 font-bold animate-pulse";
        statusBox.innerHTML = "⚠️ WARNING: SATURATION DETECTED! Latency Melonjak Tinggi!";
      } else if (cpu > 70 || ram > 70) {
        statusBox.className = "p-4 rounded-xl font-mono text-center bg-amber-950/30 border border-amber-500/30 text-amber-300";
        statusBox.innerHTML = "⚡ Amaran Beban Tinggi (High Load)";
      } else {
        statusBox.className = "p-4 rounded-xl font-mono text-center bg-emerald-950/30 border border-emerald-500/30 text-emerald-300";
        statusBox.innerHTML = "Sistem Dalam Keadaan Sihat & Normal ✅";
      }
    }

    /* Slide 82 Cache Sim */
    function updateCacheSim() {
      const val = parseInt(document.getElementById('cache-rate-slider').value);
      document.getElementById('cache-rate-val').innerText = `${val}%`;
      document.getElementById('cache-hit-count').innerText = val;
      document.getElementById('cache-miss-count').innerText = 100 - val;
    }

    /* Slide 83 Scaling Sim */
    function updateScalingSim() {
      const count = parseInt(document.getElementById('scale-server-slider').value);
      document.getElementById('scale-server-val').innerText = `${count} Server${count > 1 ? 's' : ''}`;

      // Non-linear scaling formula
      const throughput = Math.round(count * 100 * Math.pow(0.92, count - 1));
      const efficiency = Math.round((throughput / (count * 100)) * 100);

      document.getElementById('scale-throughput').innerText = `${throughput} req/s`;
      document.getElementById('scale-efficiency').innerText = `${efficiency}% (Diminishing Returns)`;
    }

    /* Slide 84 Load Test Sim */
    function runLoadTestSim(users) {
      const box = document.getElementById('load-sim-results');
      let latency = '100 ms';
      let error = '0.0%';
      let cpu = '25%';

      if (users === 50) {
        latency = '150 ms';
        error = '0.0%';
        cpu = '45%';
      } else if (users === 100) {
        latency = '280 ms';
        error = '0.2%';
        cpu = '75%';
      } else if (users === 500) {
        latency = '1,850 ms 🔥';
        error = '4.8% ❌';
        cpu = '99% 🔥';
      }

      box.innerHTML = `
        <div class="grid grid-cols-3 gap-2 text-center">
          <div><span class="text-gray-400 text-[10px]">P95 Latency</span><p class="font-bold text-blue-400">${latency}</p></div>
          <div><span class="text-gray-400 text-[10px]">Error Rate</span><p class="font-bold text-amber-400">${error}</p></div>
          <div><span class="text-gray-400 text-[10px]">CPU Saturation</span><p class="font-bold text-purple-400">${cpu}</p></div>
        </div>
      `;
    }

    /* Quiz Checker Helper */
    function checkQuiz(slideNum, option) {
      const box = document.getElementById(`quiz-${slideNum}-feedback`);
      box.classList.remove('hidden');

      let isCorrect = false;
      let text = '';

      if (slideNum === 85 && option === 'D') isCorrect = true;
      if (slideNum === 86 && option === 'B') isCorrect = true;
      if (slideNum === 87 && option === 'B') isCorrect = true;
      if (slideNum === 88 && option === 'B') isCorrect = true;

      if (isCorrect) {
        box.className = "p-3 rounded font-mono text-xs bg-emerald-950/40 border border-emerald-500/40 text-emerald-300";
        box.innerHTML = "✅ TEPAT SEKALI! Jawapan anda betul berasaskan bukti metrics.";
      } else {
        box.className = "p-3 rounded font-mono text-xs bg-red-950/40 border border-red-500/40 text-red-300";
        box.innerHTML = "❌ Kurang Tepat. Sila semak semula data metric utama.";
      }
    }

    // Initialize presentation on startup
    window.onload = initPresentation;
  </script>
</body>
</html>
